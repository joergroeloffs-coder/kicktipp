name: Kicktipp Backup-Tipps

on:
  schedule:
    # Freitags 18:00 UTC (~19-20 Uhr deutsche Zeit), kurz vor dem fruehesten Anpfiff.
    # Fuellt nur Spiele, die bis dahin nicht manuell (per lokaler UI) getippt wurden.
    - cron: "0 18 * * 5"
  workflow_dispatch: {}

jobs:
  set-tips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Fehlende Tipps als Backup setzen
        env:
          KICKTIPP_GROUP: ${{ secrets.KICKTIPP_GROUP }}
          KICKTIPP_USERNAME: ${{ secrets.KICKTIPP_USERNAME }}
          KICKTIPP_PASSWORD: ${{ secrets.KICKTIPP_PASSWORD }}
          KICKTIPP_SCREENSHOT_DIR: screenshots
        run: python main.py

      - name: Screenshots als Artifact hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicktipp-screenshots
          path: screenshots/
          if-no-files-found: ignore
