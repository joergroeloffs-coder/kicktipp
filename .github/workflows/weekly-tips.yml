name: Kicktipp Taeglicher Tipp-Abgleich

on:
  schedule:
    # Taeglich um 06:00 UTC (~7-8 Uhr deutsche Zeit): berechnet alle Spiele
    # neu und korrigiert bereits gesetzte Tipps, falls sich die Prognose
    # (Form, Tabelle, Quoten) seit dem letzten Lauf geaendert hat. Spiele
    # nach Anpfiff sind von Kicktipp gesperrt und werden nie angefasst.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      explain_match:
        description: 'Optional: "Heimteam,Gastteam" -- zeigt nur die Rechenschritte fuer dieses Spiel, ohne Tipps zu setzen.'
        required: false
        default: ""

jobs:
  set-tips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Tipps neu berechnen und abgleichen
        if: ${{ github.event.inputs.explain_match == '' }}
        env:
          KICKTIPP_GROUP: ${{ secrets.KICKTIPP_GROUP }}
          KICKTIPP_USERNAME: ${{ secrets.KICKTIPP_USERNAME }}
          KICKTIPP_PASSWORD: ${{ secrets.KICKTIPP_PASSWORD }}
          KICKTIPP_SCREENSHOT_DIR: screenshots
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 8
        run: python main.py

      - name: Tipp-Berechnung fuer ein Spiel erklaeren
        if: ${{ github.event.inputs.explain_match != '' }}
        env:
          KICKTIPP_GROUP: ${{ secrets.KICKTIPP_GROUP }}
          KICKTIPP_USERNAME: ${{ secrets.KICKTIPP_USERNAME }}
          KICKTIPP_PASSWORD: ${{ secrets.KICKTIPP_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 5
        run: |
          IFS=',' read -r MATCH_HOME MATCH_AWAY <<< "${{ github.event.inputs.explain_match }}"
          python explain_tip.py "$MATCH_HOME" "$MATCH_AWAY"

      - name: Screenshots als Artifact hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicktipp-screenshots
          path: screenshots/
          if-no-files-found: ignore
